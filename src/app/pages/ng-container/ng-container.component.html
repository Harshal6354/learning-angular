<p class="h5 text-primary">ng-container works!</p>

<div class="row mb-4">
  <div class="col-md-4">
    <ng-container *ngIf="isvisible">
      <div class="alert alert-success p-2">
        <strong>I am from India 🇮🇳</strong>
      </div>
    </ng-container>
  </div>
</div>

<!-- Project Table -->
<div class="card shadow-sm mb-4">
  <div class="card-header bg-dark text-white">Project Details</div>
  <div class="card-body table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Project Title</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="isApi; else showProject">
          <tr>
            <td colspan="4" class="text-center">
              <div class="spinner-border text-primary" role="status"></div>
            </td>
          </tr>
        </ng-container>

        <ng-template #showProject>
          <tr *ngFor="let item of userlist; let i = index; trackBy: trackByFn">
            <td>{{ i + 1 }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.username }}</td>
            <td>{{ item.email }}</td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>
</div>

<!-- Image Table -->
<div class="card shadow-sm">
  <div class="card-header bg-secondary text-white">Image Data (via Picsum)</div>
  <div class="card-body table-responsive">
    <table class="table table-striped align-middle text-center">
      <thead class="table-secondary">
        <tr>
          <th>ID</th>
          <th>Author</th>
          <th>Width</th>
          <th>Height</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let photo of userlist2">
          <td>{{ photo.id }}</td>
          <td>{{ photo.author }}</td>
          <td>{{ photo.width }}</td>
          <td>{{ photo.height }}</td>
          <td>
            <img
              [src]="photo.download_url"
              alt="photo"
              class="img-thumbnail"
              width="100"
              height="100"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Buttons -->
<div class="mt-3 d-flex gap-3">
  <button class="btn btn-outline-primary" (click)="getapi()">
    Reload Project Data
  </button>
  <button class="btn btn-outline-success" (click)="getImg()">
    Load Image Data
  </button>
</div>
